<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>LinuxDocs — Linux &amp; CTF Command Reference</title>
    <meta
      name="description"
      content="An MDN-style reference for Linux commands and CTF security tools: real syntax, flags, examples and output — plus bookmarks, notes and a practice terminal."
    />
    <meta name="theme-color" content="#131110" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)" />

    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LinuxDocs" />
    <meta property="og:title" content="LinuxDocs — Linux &amp; CTF Command Reference" />
    <meta
      property="og:description"
      content="A precise, searchable reference for Linux utilities and CTF tooling, with examples you can copy straight into a shell."
    />
    <meta property="og:image" content="/og-image.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LinuxDocs — Linux &amp; CTF Command Reference" />
    <meta
      name="twitter:description"
      content="A precise, searchable reference for Linux utilities and CTF tooling, with examples you can copy straight into a shell."
    />
    <meta name="twitter:image" content="/og-image.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Geist:wght@300..700&family=JetBrains+Mono:wght@400..700&display=swap"
      rel="stylesheet"
    />

    <script>
      (function () {
        try {
          var theme = localStorage.getItem('linuxdocs_theme');
          if (theme === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          } else {
            document.documentElement.classList.remove('light');
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
