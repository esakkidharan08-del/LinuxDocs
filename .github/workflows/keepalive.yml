# Keeps the managed Postgres from sleeping: Supabase pauses free projects
# after ~7 days of no connections, which would leave the deployed site
# failing until someone manually wakes the database. A ping every 3 days
# through the Vercel domain (which rewrites /api/* to the Render service)
# does SELECT 1 and reports latency without revealing anything.
#
# REQUIRED: repository variable KEEPALIVE_URL pointed at the deployed
# readiness endpoint, e.g.
#     https://<your-site>.vercel.app/api/ready
# (Repo → Settings → Secrets and variables → Actions → Variables tab.)
#
# Runs are visible (and email-able) in the Actions tab when the URL is bad
# or the ping fails 2xx validation.

name: keepalive

on:
  schedule:
    - cron: '0 3 */3 * *'   # every 3rd day (UTC 03:00) — well under the 7-day pause
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the deployed /api/ready endpoint
        run: |
          if [ -z "${KEEPALIVE_URL}" ]; then
            echo "Repository variable KEEPALIVE_URL is not set."
            echo "Set it to the deployed /api/ready URL (see header comment)."
            exit 1
          fi
          echo "Pinging ${KEEPALIVE_URL}"
          curl -fsS --max-time 60 "${KEEPALIVE_URL}"
          echo
        env:
          KEEPALIVE_URL: ${{ vars.KEEPALIVE_URL }}
