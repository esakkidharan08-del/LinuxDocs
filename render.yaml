# Render blueprint for the LinuxDocs API (Flask + Partners Postgres).
#
# Deploy with:  Render dashboard -> New + -> Blueprint -> pick this repo.
# After the first deploy, set FRONTEND_ORIGIN and ALLOWED_HOSTS to your real
# Vercel URLs (see README "Deploy your own") so CORS + the Host-header
# allowlist accept browser traffic routed through Vercel's /api/* rewrites.
#
# The app reads DATABASE_URL for SQLAlchemy, which points at Postgres here;
# the SQLite-only persistence machinery (WAL, backups, maintenance) detects
# a non-SQLite URI and disables itself automatically.

services:
  - type: web
    name: linuxdocs-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60 --access-logfile -
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: linuxdocs-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: TRUST_PROXY_HEADERS
        value: "1"
      # Replace the two placeholders with your exact URLs after creating the
      # services (front = Vercel site, api = this service's *.onrender.com URL).
      - key: FRONTEND_ORIGIN
        value: https://your-site.vercel.app
      - key: ALLOWED_HOSTS
        value: linuxdocs-api.onrender.com
      # (Optional) password-reset email delivery — set in the dashboard once:
      #   RESEND_API_KEY (recommended on Render, no SMTP ports involved) or
      #   SMTP_HOST / SMTP_PORT / SMTP_USER / SMTP_PASSWORD for any SMTP server,
      # plus MAIL_FROM such as "LinuxDocs <no-reply@yourdomain.com>".
      # Without it, reset requests answer 202 but never mail anything.

databases:
  - name: linuxdocs-db
    plan: free
    databaseName: linuxdocs
    user: linuxdocs
    postgresMajorVersion: "16"
